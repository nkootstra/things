[project]
name = "things-sdk"
version = "0.3.1"
description = "Reusable Python SDK for Things Cloud sync — domain models, cloud client, sync engine, and task operations"
readme = "README.md"
authors = [
    { name = "Niels Kootstra", email = "niels.kootstra@pm.me" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = ["things", "things3", "sdk", "sync", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/nkootstra/things/tree/main/packages/things-sdk"
Repository = "https://github.com/nkootstra/things"
Issues = "https://github.com/nkootstra/things/issues"
Changelog = "https://github.com/nkootstra/things/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/things_sdk"]
