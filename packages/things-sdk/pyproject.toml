[project]
name = "things-sdk"
version = "0.2.0"
description = "Reusable Python SDK for Things Cloud sync — domain models, cloud client, sync engine, and task operations"
readme = "README.md"
authors = [
    { name = "Niels Kootstra", email = "545768+nkootstra@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/things_sdk"]
