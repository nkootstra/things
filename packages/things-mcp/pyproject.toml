[project]
name = "things-cloud-mcp"
version = "0.3.1"
description = "Model Context Protocol server for Things3 — gives AI agents read/write access to your tasks via things-api"
readme = "README.md"
authors = [
    { name = "Niels Kootstra", email = "niels.kootstra@pm.me" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = ["things", "things3", "mcp", "ai", "agent", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.28",
]

[project.scripts]
things-cloud-mcp = "things_mcp:main"

[project.urls]
Homepage = "https://github.com/nkootstra/things/tree/main/packages/things-mcp"
Repository = "https://github.com/nkootstra/things"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/things_mcp"]
