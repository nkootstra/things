services:
  api:
    image: ghcr.io/nkootstra/things:latest
    ports:
      - "3117:8000"
    environment:
      - API_KEY=${API_KEY}
      - THINGS_EMAIL=${THINGS_EMAIL}
      - THINGS_PASSWORD=${THINGS_PASSWORD}
      - DATABASE_URL=sqlite+aiosqlite:///app/data/things.db
    volumes:
      - things-data:/app/data

volumes:
  things-data:
